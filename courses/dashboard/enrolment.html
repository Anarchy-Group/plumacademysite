<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plum Courses — Enrol</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background: #fff7f4;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .main-bg {
      background:
        radial-gradient(circle at top left, rgba(255, 71, 126, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 132, 64, 0.12), transparent 35%),
        linear-gradient(135deg, #fff5f2 0%, #fff8f6 60%, #ffffff 100%);
      min-height: 100vh;
    }

    .gradient-text {
      background: linear-gradient(90deg, #ff477e 0%, #ff7a45 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff477e, #ff7a45);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-button {
      background: linear-gradient(135deg, #ff477e 0%, #ff7a45 100%);
      box-shadow: 0 0 24px rgba(255, 105, 97, 0.3);
    }

    .gradient-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .glass-card {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
    }

    .avatar-circle {
      background: linear-gradient(135deg, #ff477e 0%, #ff7a45 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .course-card {
      background: rgba(255,255,255,0.78);
      border: 2px solid transparent;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .course-card:hover:not(.enrolled) {
      border-color: rgba(255,122,69,0.35);
      background: rgba(255,245,240,0.98);
      transform: translateY(-3px);
      box-shadow: 0 14px 36px rgba(255,100,80,0.13);
    }

    .course-card.enrolled {
      background: rgba(240,255,244,0.9);
      border-color: rgba(34,197,94,0.25);
      cursor: default;
      opacity: 0.85;
    }

    .course-card .card-glow {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff477e, #ff7a45);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .course-card:hover:not(.enrolled) .card-glow {
      opacity: 1;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .tag-level {
      background: rgba(255,120,80,0.08);
      border: 1px solid rgba(255,100,80,0.15);
      color: #c04828;
    }

    .tag-category {
      background: rgba(100,100,255,0.06);
      border: 1px solid rgba(100,100,255,0.14);
      color: #4848b0;
    }

    .tag-duration {
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.08);
      color: #666;
    }

    .skill-chip {
      background: rgba(255,120,80,0.07);
      border: 1px solid rgba(255,100,80,0.13);
      color: #b84020;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .filter-btn {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,120,120,0.15);
      transition: all 0.2s ease;
      color: #555;
    }

    .filter-btn:hover { background: #fff0eb; border-color: rgba(255,122,69,0.3); }

    .filter-btn.active {
      background: linear-gradient(135deg, #ff477e 0%, #ff7a45 100%);
      border-color: transparent;
      color: white;
      box-shadow: 0 0 16px rgba(255,105,97,0.28);
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(255,200,180,0.3) 25%, rgba(255,230,220,0.5) 50%, rgba(255,200,180,0.3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 16px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    #errorState  { display: none; }
    #pageContent { display: none; }
  </style>
</head>

<body>
<div class="main-bg">

  <!-- HEADER -->
  <header class="w-full border-b border-orange-100 bg-white/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">

      <div class="logo">🍑 Plum Courses</div>

      <nav class="hidden lg:flex items-center gap-8 text-gray-600 font-semibold text-sm">
        <a href="/courses/dashboard.html" class="hover:text-gray-900 transition">Dashboard</a>
        <a href="/courses/my-courses.html" class="hover:text-gray-900 transition">My Courses</a>
        <a href="/courses/skills.html" class="hover:text-gray-900 transition">Skills</a>
        <a href="#" class="hover:text-gray-900 transition">Resources</a>
        <a href="#" class="hover:text-gray-900 transition">Community</a>
      </nav>

      <div class="flex items-center gap-3">
        <div id="headerAvatar" class="avatar-circle w-9 h-9 rounded-full text-sm hidden"></div>
        <button id="signOutBtn" class="text-sm font-bold text-gray-500 hover:text-gray-800 transition hidden">Sign out</button>
      </div>
    </div>
  </header>

  <!-- ERROR / NOT SIGNED IN -->
  <div id="errorState" class="max-w-7xl mx-auto px-4 sm:px-6 py-24 text-center">
    <div class="text-6xl mb-6">🔒</div>
    <h2 class="text-3xl font-black text-gray-900 mb-4">You're not signed in</h2>
    <p class="text-gray-500 mb-8">Please sign in to enrol in courses.</p>
    <a href="/courses/login.html" class="gradient-button inline-block text-white font-bold px-8 py-4 rounded-2xl hover:scale-105 transition duration-300">Go to Login</a>
  </div>

  <!-- PAGE CONTENT -->
  <div id="pageContent" class="max-w-7xl mx-auto px-4 sm:px-6 py-10 pb-24">

    <!-- HEADING -->
    <div class="mb-10 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
      <div>
        <h1 class="text-4xl sm:text-5xl font-black text-gray-900 leading-tight">
          Enrol in a <span class="gradient-text">Course</span>
        </h1>
        <p class="text-gray-500 mt-2 text-lg">Choose from our catalogue and start learning today.</p>
      </div>
      <a href="/courses/my-courses.html" class="text-sm font-bold text-orange-500 hover:text-orange-600 transition self-start sm:self-auto">
        ← Back to My Courses
      </a>
    </div>

    <!-- FILTER TABS -->
    <div class="flex items-center gap-3 mb-8 flex-wrap">
      <button class="filter-btn active px-5 py-2 rounded-2xl font-bold text-sm" data-filter="all">All</button>
      <button class="filter-btn px-5 py-2 rounded-2xl font-bold text-sm" data-filter="Creative">🎨 Creative</button>
      <button class="filter-btn px-5 py-2 rounded-2xl font-bold text-sm" data-filter="Technology">💻 Technology</button>
      <button class="filter-btn px-5 py-2 rounded-2xl font-bold text-sm" data-filter="Media">📱 Media</button>
      <button class="filter-btn px-5 py-2 rounded-2xl font-bold text-sm" data-filter="Business">📈 Business</button>
    </div>

    <!-- SKELETON -->
    <div id="gridSkeleton" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-6">
      <div class="skeleton h-72 rounded-[28px]"></div>
      <div class="skeleton h-72 rounded-[28px]"></div>
      <div class="skeleton h-72 rounded-[28px]"></div>
      <div class="skeleton h-72 rounded-[28px]"></div>
      <div class="skeleton h-72 rounded-[28px]"></div>
      <div class="skeleton h-72 rounded-[28px]"></div>
    </div>

    <!-- COURSES GRID -->
    <div id="coursesGrid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-6 hidden"></div>

    <!-- EMPTY FILTER STATE -->
    <div id="emptyFilter" class="hidden text-center py-20">
      <div class="text-5xl mb-4">🔍</div>
      <h3 class="text-xl font-black text-gray-900 mb-2">No courses in this category</h3>
      <p class="text-gray-500">Try a different filter.</p>
    </div>

  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="glass-card px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
    <span id="toastIcon" class="text-xl"></span>
    <span id="toastMsg" class="font-bold text-gray-900 text-sm"></span>
  </div>

</div>

<script>
  const SUPABASE_URL      = 'https://jihpgbsghatuwwkacsur.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppaHBnYnNnaGF0dXd3a2Fjc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzkxNzcsImV4cCI6MjA5MzcxNTE3N30.qH7iso7t2zoOLi0C68DiUKZecyIDhlxVcJAcNhYLHTk';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Hardcoded course catalogue ──────────────────────────────────────────────
  const CATALOGUE = [
    {
      slug: 'content-creator-academy',
      name: 'Content Creator Academy',
      category: 'Media',
      emoji: '🎬',
      level: 'Beginner',
      duration: '6 weeks',
      description: 'Master video editing, brand identity, and audience growth strategies to become a full-time creator.',
      skills: ['Video Editing', 'Branding', 'Audience Growth', 'Storytelling'],
    },
    {
      slug: 'photography-essentials',
      name: 'Photography Essentials',
      category: 'Creative',
      emoji: '📷',
      level: 'Beginner',
      duration: '4 weeks',
      description: 'Learn camera fundamentals, lighting techniques, and composition to capture stunning photos.',
      skills: ['Photography', 'Lighting', 'Composition', 'Editing'],
    },
    {
      slug: 'web-design-fundamentals',
      name: 'Web Design Fundamentals',
      category: 'Technology',
      emoji: '🌐',
      level: 'Beginner',
      duration: '8 weeks',
      description: 'Build modern, responsive websites from scratch using HTML, CSS, and design principles.',
      skills: ['HTML', 'CSS', 'Web Design', 'Responsive Layout'],
    },
    {
      slug: 'digital-media-skills',
      name: 'Digital Media Skills',
      category: 'Media',
      emoji: '📱',
      level: 'Beginner',
      duration: '5 weeks',
      description: 'Grow your online presence with social media strategy, content planning, and community building.',
      skills: ['Social Media', 'Content Planning', 'Growth', 'Analytics'],
    },
    {
      slug: 'javascript-for-beginners',
      name: 'JavaScript for Beginners',
      category: 'Technology',
      emoji: '⚙️',
      level: 'Intermediate',
      duration: '10 weeks',
      description: 'Go from zero to writing real JavaScript — covering variables, functions, DOM manipulation and APIs.',
      skills: ['JavaScript', 'Programming', 'DOM', 'APIs'],
    },
    {
      slug: 'brand-design-essentials',
      name: 'Brand Design Essentials',
      category: 'Creative',
      emoji: '🎨',
      level: 'Beginner',
      duration: '5 weeks',
      description: 'Create compelling brand identities with logo design, colour theory, and typography fundamentals.',
      skills: ['Branding', 'Design', 'Typography', 'Colour Theory'],
    },
    {
      slug: 'seo-and-digital-marketing',
      name: 'SEO & Digital Marketing',
      category: 'Business',
      emoji: '🔍',
      level: 'Intermediate',
      duration: '6 weeks',
      description: 'Drive organic traffic and grow businesses online with proven SEO and digital marketing strategies.',
      skills: ['SEO', 'Marketing', 'Analytics', 'Copywriting'],
    },
    {
      slug: 'ux-design-principles',
      name: 'UX Design Principles',
      category: 'Creative',
      emoji: '🧩',
      level: 'Intermediate',
      duration: '7 weeks',
      description: 'Design user-centred digital products using wireframing, prototyping, and usability testing.',
      skills: ['UX', 'UI', 'Wireframing', 'Prototyping'],
    },
    {
      slug: 'freelancing-essentials',
      name: 'Freelancing Essentials',
      category: 'Business',
      emoji: '💼',
      level: 'Beginner',
      duration: '3 weeks',
      description: 'Launch and grow a freelance career — from finding clients and pricing to contracts and delivery.',
      skills: ['Freelancing', 'Client Management', 'Pricing', 'Growth'],
    },
  ];

  const levelColour = {
    'Beginner':     'tag-level',
    'Intermediate': 'bg-purple-50 border border-purple-200 text-purple-700',
    'Advanced':     'bg-red-50 border border-red-200 text-red-700',
  };

  const categoryColour = {
    'Creative':   'tag-category',
    'Technology': 'bg-blue-50 border border-blue-200 text-blue-700',
    'Media':      'bg-pink-50 border border-pink-200 text-pink-600',
    'Business':   'bg-emerald-50 border border-emerald-200 text-emerald-700',
  };

  // ── State ───────────────────────────────────────────────────────────────────
  let enrolledSlugs = new Set();
  let activeFilter  = 'all';
  let currentUser   = null;
  let enrollingSlug = null; // prevents double-click

  // ── Toast ───────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, icon = '✅') {
    clearTimeout(toastTimer);
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent  = msg;
    document.getElementById('toast').classList.add('show');
    toastTimer = setTimeout(() => document.getElementById('toast').classList.remove('show'), 3200);
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function getInitials(name, email) {
    if (name?.trim()) {
      const parts = name.trim().split(' ');
      return parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : parts[0].slice(0, 2).toUpperCase();
    }
    return email ? email.slice(0, 2).toUpperCase() : '??';
  }

  // ── Render ──────────────────────────────────────────────────────────────────
  function buildCard(course) {
    const isEnrolled = enrolledSlugs.has(course.slug);
    const lvlCls  = levelColour[course.level]    || 'tag-level';
    const catCls  = categoryColour[course.category] || 'tag-category';

    return `
      <div class="course-card rounded-[28px] p-6 flex flex-col gap-4 ${isEnrolled ? 'enrolled' : ''}"
           data-slug="${course.slug}" data-category="${course.category}">
        <div class="card-glow"></div>

        <!-- Top -->
        <div class="flex items-start justify-between gap-3">
          <div class="text-4xl">${course.emoji}</div>
          ${isEnrolled
            ? '<span class="tag bg-green-100 border border-green-200 text-green-700">✓ Enrolled</span>'
            : `<span class="tag ${lvlCls}">${course.level}</span>`
          }
        </div>

        <!-- Title + description -->
        <div class="flex-1">
          <h3 class="text-xl font-black text-gray-900 leading-snug mb-2">${course.name}</h3>
          <p class="text-gray-500 text-sm leading-relaxed">${course.description}</p>
        </div>

        <!-- Meta tags -->
        <div class="flex flex-wrap gap-2">
          <span class="tag ${catCls}">${course.category}</span>
          <span class="tag tag-duration">⏱ ${course.duration}</span>
        </div>

        <!-- Skills preview -->
        <div class="flex flex-wrap gap-1">
          ${course.skills.map(s => `<span class="skill-chip">⚡ ${s}</span>`).join('')}
        </div>

        <!-- CTA -->
        ${isEnrolled
          ? `<a href="/courses/my-courses.html"
                class="block w-full text-center bg-green-50 border border-green-200 text-green-700 font-bold py-3 rounded-2xl text-sm transition hover:bg-green-100">
               Go to My Courses →
             </a>`
          : `<button
               class="enrol-btn gradient-button w-full text-white font-bold py-3 rounded-2xl text-sm hover:scale-[1.02] transition duration-300"
               data-slug="${course.slug}"
               data-name="${course.name}"
               data-skills='${JSON.stringify(course.skills)}'>
               Enrol Now
             </button>`
        }
      </div>
    `;
  }

  function renderGrid() {
    const grid        = document.getElementById('coursesGrid');
    const emptyFilter = document.getElementById('emptyFilter');

    const filtered = activeFilter === 'all'
      ? CATALOGUE
      : CATALOGUE.filter(c => c.category === activeFilter);

    if (filtered.length === 0) {
      grid.innerHTML = '';
      emptyFilter.classList.remove('hidden');
    } else {
      emptyFilter.classList.add('hidden');
      grid.innerHTML = filtered.map(buildCard).join('');
    }

    // Attach enrol button listeners
    grid.querySelectorAll('.enrol-btn').forEach(btn => {
      btn.addEventListener('click', () => handleEnrol(btn));
    });
  }

  // ── Enrolment ───────────────────────────────────────────────────────────────
  async function handleEnrol(btn) {
    const slug   = btn.dataset.slug;
    const name   = btn.dataset.name;
    const skills = JSON.parse(btn.dataset.skills);

    if (enrollingSlug === slug) return; // prevent double click
    if (enrolledSlugs.has(slug)) return;

    enrollingSlug = slug;
    btn.disabled     = true;
    btn.textContent  = 'Enrolling…';

    const { error } = await sb.from('user_courses').insert({
      user_id:          currentUser.id,
      course_name:      name,
      course_slug:      slug,
      progress_pct:     0,
      hours_learned:    0,
      status:           'not_started',
      achievements:     [],
      skills:           skills,
    });

    enrollingSlug = null;

    if (error) {
      console.error('Enrolment failed:', error.message);
      btn.disabled    = false;
      btn.textContent = 'Enrol Now';
      showToast('Something went wrong. Please try again.', '❌');
      return;
    }

    enrolledSlugs.add(slug);
    showToast(`Enrolled in ${name}!`, '🎉');

    // Brief pause then redirect to My Courses
    setTimeout(() => {
      window.location.href = '/courses/my-courses.html';
    }, 1400);
  }

  // ── Filter buttons ──────────────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderGrid();
    });
  });

  // ── Init ────────────────────────────────────────────────────────────────────
  async function loadPage() {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      document.getElementById('errorState').style.display = 'block';
      return;
    }

    currentUser = session.user;
    document.getElementById('pageContent').style.display = 'block';

    const headerAvatar = document.getElementById('headerAvatar');
    headerAvatar.classList.remove('hidden');
    document.getElementById('signOutBtn').classList.remove('hidden');

    // Fetch profile + already-enrolled slugs in parallel
    const [{ data: profile }, { data: enrolled }] = await Promise.all([
      sb.from('user_profiles').select('display_name').eq('id', currentUser.id).maybeSingle(),
      sb.from('user_courses').select('course_slug').eq('user_id', currentUser.id),
    ]);

    headerAvatar.textContent = getInitials(profile?.display_name, currentUser.email);
    enrolledSlugs = new Set((enrolled || []).map(r => r.course_slug));

    // Hide skeleton, show grid
    document.getElementById('gridSkeleton').classList.add('hidden');
    document.getElementById('coursesGrid').classList.remove('hidden');

    renderGrid();

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.replace('/courses/login.html');
    });
  }

  loadPage();
</script>
</body>
</html>
